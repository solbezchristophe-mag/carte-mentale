<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carte mentale interactive</title>
  <link rel="stylesheet" href="styles.css?v=20260913-clean" />
</head>
<body>
  <!-- Zone principale de la carte mentale -->
  <main id="mindmap" aria-label="Carte mentale interactive">
    <!-- Calque d’arrière-plan des icônes libres -->
    <canvas id="freeIconLayer" aria-label="Icônes libres arrière-plan"></canvas>
    <!-- Dessin SVG des branches, idées et sous-idées -->
    <svg id="connections" aria-hidden="true"></svg>
    <!-- Calque d’icônes libres pouvant passer visuellement devant les branches.
         Il reste non interactif : les branches gardent toujours la priorité souris. -->
    <canvas id="freeIconFrontLayer" aria-label="Icônes libres premier plan"></canvas>

    <details id="appMenu" class="app-menu">
      <summary id="appMenuToggle" class="app-menu-toggle" aria-label="Ouvrir le menu">☰ Menu</summary>
      <div id="appMenuPanel" class="app-menu-panel">
        <button id="addBranch" class="add-main-button action-button action-button-primary" type="button">+ Ajouter une branche</button>
        <button id="addFreeIcon" class="add-free-icon-button action-button" type="button">+ Icône</button>
        <button id="savePdf" class="save-pdf-button action-button action-button-save" type="button" title="Enregistrer le projet en PDF">Enregistrer sous</button>
        <button id="resetMap" class="reset-button action-button action-button-reset" type="button">Recommencer</button>
      </div>
    </details>

    <!-- Sujet central -->
    <section id="centre" class="centre" aria-label="Sujet central">
      <textarea id="centreInput" rows="1" spellcheck="false" aria-label="Nom du projet">MON PROJET</textarea>
    </section>

    <!-- Calques d’interaction -->
    <div id="branchControlsLayer"></div>
    <div id="freeIconOverlayLayer" aria-label="Contrôles des icônes"></div>
    <div id="freeIconResizePreview" class="free-icon-resize-preview" aria-hidden="true"></div>
    <div id="editorLayer"></div>

  </main>

  <!-- Fenêtre de sélection et de recherche d’icônes -->
  <div id="iconPicker" class="icon-picker" aria-hidden="true">
    <div id="iconPickerBackdrop" class="icon-picker-backdrop"></div>
    <section class="icon-picker-panel" role="dialog" aria-modal="true" aria-label="Choisir une icône">
      <div class="icon-picker-header">
        <div>
          <strong>Choisir une icône</strong>
          <small>Choisissez une icône puis : seule ou avec le texte</small>
        </div>
        <button id="iconPickerClose" class="icon-picker-close" type="button" aria-label="Fermer">×</button>
      </div>
      <div id="iconPickerGrid" class="icon-picker-grid"></div>
    </section>
  </div>

  <script src="app.js?v=20260913-clean"></script>
</body>
</html>
